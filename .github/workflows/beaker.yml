---
name: Puppet

on:
  workflow_call:
    inputs:
      rubocop:
        description: Whether to run Rubocop
        default: true
        required: false
        type: boolean
      timeout_minutes:
        description: The maximum time (in minutes) for a job to take.
        default: 45
        required: false
        type: number
      working-directory:
        description: The working directory where all jobs should be executed. Used for modules in subdirectories like a monorepo or a control repository.
        default: '.'
        required: false
        type: string
      cache-version:
        description: The cache version to pass to setup-ruby
        default: '0'
        required: false
        type: string
      additional_packages:
        description: String of additional packages that should be installed
        default: ''
        required: false
        type: string
      beaker_hypervisor:
        description: The hypervisor beaker will use to start containers/VMs
        default: container_podman
        required: false
        type: string
      install_vagrant_dependencies:
        description: When true and beaker_hypervisor==vagrant_libvirt, we will install vagrant + libvirt
        default: true
        required: false
        type: boolean
      beaker_facter:
        description: Expand the Beaker matrix based on a fact
        default: 'false'
        required: false
        type: string
      beaker_hosts:
        description: Expand the Beaker setfile with hosts and roles
        default: 'false'
        required: false
        type: string
      beaker_staging_url:
        description: |-
          URL to a staging Server to test unreleased packages.
          We will append the version to the Server and assume all packages are in the same directory.
          Only supported for AIO packages.
        default: 'https://artifacts.voxpupuli.org/openvox-agent'
        required: false
        type: string
      beaker_collection:
        description: |-
          When set to staging, we will download the packages from staging_url.
          Otherwise we will use the official repos. Supported values: puppet7, puppet8, openvox7, openvox8, staging.
          When unset, we will generate a list of supported collections based on metadata.json.
        required: false
        type: string
      beaker_staging_version:
        description: |-
          The package version we want to test.
          Only used for beaker_collection = staging
        required: false
        type: string

      domain:
        description: The domain that will be used for the beaker instances
        default: "example.com"
        required: false
        type: string
      unit_runs_on:
        description: the runner group used for unit jobs run on
        default: ubuntu-24.04
        required: false
        type: string
      unit_use_container:
        description: whether to use voxbox
        default: false
        required: false
        type: boolean
      unit_container_image:
        description: the container image to use for unit tests when unit_use_container is true
        default: ghcr.io/voxpupuli/voxbox:8.24.2-main
        required: false
        type: string
      acceptance_runs_on:
        description: the runner group used for acceptance jobs run on
        default: ubuntu-24.04
        required: false
        type: string
    secrets:
      beaker_hcloud_token:
        description: token to access the Hetzner Cloud API
        required: false

env:
  BEAKER_HYPERVISOR: ${{ inputs.beaker_hypervisor }}

jobs:
  setup_matrix:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    name: Static validations
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      puppet_unit_test_matrix: ${{ steps.get-outputs.outputs.puppet_unit_test_matrix }}
      puppet_beaker_test_matrix: ${{ steps.get-outputs.outputs.puppet_beaker_test_matrix }}
    env:
      BUNDLE_WITHOUT: development:system_tests:release
      PUPPET_GEM_VERSION: ">= 7.0"
      OPENVOX_GEM_VERSION: ">= 7.0"
      BEAKER_STAGING_VERSION: ${{ inputs.beaker_staging_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: install additional packages
        if: ${{ inputs.additional_packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.additional_packages }}
      - name: Setup ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.317.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: ${{ inputs.cache-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Display Ruby environment
        run: bundle env
      - name: Run static validations
        run: bundle exec rake validate lint check
      - name: Run rake rubocop
        run: bundle exec rake rubocop
        if: ${{ inputs.rubocop }}
      - name: Setup Test Matrix
        id: get-outputs
        run: bundle exec metadata2gha --domain ${{ inputs.domain }} --beaker-facter "${{ inputs.beaker_facter }}" --beaker-hosts "${{ inputs.beaker_hosts }}" ${COLLECTION:+--collection "${COLLECTION}"}
        env:
          COLLECTION: ${{ inputs.beaker_collection }}

  unit:
    if: ${{ !inputs.unit_use_container }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    needs: setup_matrix
    runs-on: ${{ inputs.unit_runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.setup_matrix.outputs.puppet_unit_test_matrix)}}
    env:
      BUNDLE_WITHOUT: development:system_tests:release
      PUPPET_GEM_VERSION: "~> ${{ matrix.puppet }}.0"
      OPENVOX_GEM_VERSION: "~> ${{ matrix.puppet }}.0"
    name: ${{ matrix.puppet }} (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: install additional packages
        if: ${{ inputs.additional_packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.additional_packages }}
      - name: Setup ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.317.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ inputs.cache-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Display Ruby environment
        run: bundle env
      - name: Run tests
        run: bundle exec rake parallel_spec

  unit_container:
    if: ${{ inputs.unit_use_container }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    needs: setup_matrix
    runs-on: ${{ inputs.unit_runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.setup_matrix.outputs.puppet_unit_test_matrix)}}
    container:
      image: ${{ inputs.unit_container_image }}
    env:
      BUNDLE_WITHOUT: development:system_tests:release
      OPENVOX_GEM_VERSION: "~> ${{ matrix.puppet }}.0"
    name: ${{ matrix.puppet }} (Ruby ${{ matrix.ruby }}) [container]
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: apk add --no-cache build-base
      - name: Show bundler config
        run: bundle config list
      - name: Install bundle dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake parallel_spec

  acceptance:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    needs: setup_matrix
    runs-on: ${{ inputs.acceptance_runs_on }}
    env:
      BUNDLE_WITHOUT: development:test:release
      BEAKER_HCLOUD_TOKEN: '${{ secrets.beaker_hcloud_token }}'
      BEAKER_STAGING_VERSION: ${{ inputs.beaker_staging_version }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.setup_matrix.outputs.puppet_beaker_test_matrix)}}
    name: "${{ matrix.name }}"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: disable apparmor
        run: |
          # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2093797
          sudo aa-teardown || true
          sudo systemctl disable --now apparmor.service
      - name: install additional packages
        if: ${{ inputs.additional_packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.additional_packages }}
      - name: Setup podman
        if: ${{ inputs.beaker_hypervisor == 'container_podman' }}
        run: |
          systemctl start --user podman.socket
          echo "DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
      - name: Setup libvirt for Vagrant
        if: ${{ inputs.beaker_hypervisor == 'vagrant_libvirt' && inputs.install_vagrant_dependencies == true }}
        run: |
          sudo add-apt-repository ppa:evgeni/vagrant
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vagrant vagrant-libvirt libvirt-daemon-system libvirt-daemon qemu-system-x86 qemu-utils dnsmasq
          sudo chmod 666 /var/run/libvirt/libvirt-sock
      - name: Setup ruby
        uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.317.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: ${{ inputs.cache-version }}
          working-directory: ${{ inputs.working-directory }}
          self-hosted: ${{ ! startsWith(inputs.acceptance_runs_on, 'ubuntu-') }}
      - name: Display Ruby environment
        run: bundle env
      - name: Run tests
        run: bundle exec rake beaker
        env: ${{ matrix.env }}

  tests:
    if: always()
    needs:
      - unit
      - unit_container
      - acceptance
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: ${{ inputs.unit_use_container && 'unit' || 'unit_container' }}
          jobs: ${{ toJSON(needs) }}
