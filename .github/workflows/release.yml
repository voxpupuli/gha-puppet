---
name: Release

on:
  workflow_call:
    inputs:
      allowed_owner:
        description: Only allow this owner
        required: true
        type: string
      working-directory:
        description: The working directory where all jobs should be executed. Used
          for modules in subdirectories like a monorepo or a control repository.
        default: .
        required: false
        type: string
    secrets:
      username:
        description: The forge username to use
        required: true
      api_key:
        description: The forge API key
        required: true

env:
  BUNDLE_WITHOUT: development:test:system_tests

jobs:
  release:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    name: Puppet Forge
    runs-on: ubuntu-24.04
    if: github.repository_owner == inputs.allowed_owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Build and Release
        env:
          # Configure secrets here:
          #  https://docs.github.com/en/free-pro-team@latest/actions/reference/encrypted-secrets
          BLACKSMITH_FORGE_USERNAME: ${{ secrets.username }}
          BLACKSMITH_FORGE_API_KEY: ${{ secrets.api_key }}
        run: bundle exec rake module:push
      - name: Create Release Page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes
      - name: Attach puppet module to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} pkg/puppet-*tar.gz
