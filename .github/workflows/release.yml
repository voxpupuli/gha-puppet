---

name: Release

on:
  workflow_call:
    inputs:
      allowed_owner:
        description: 'Only allow this owner'
        required: true
        type: string
      working-directory:
        description: The working directory where all jobs should be executed. Used for modules in subdirectories like a monorepo or a control repository.
        default: '.'
        required: false
        type: string
    secrets:
      username:
        description: 'The forge username to use'
        required: true
      api_key:
        description: 'The forge API key'
        required: true

env:
  BUNDLE_WITHOUT: development:test:system_tests

jobs:
  release:
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    name: 'Puppet Forge'
    runs-on: ubuntu-24.04
    # `environment` enables better auditing and fine grained permissions
    # https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
    environment: release
    if: github.repository_owner == inputs.allowed_owner
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1.318.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}
      - name: Display Ruby environment
        run: bundle env
      - name: Build and Release
        env:
          # Configure secrets here:
          #  https://docs.github.com/en/free-pro-team@latest/actions/reference/encrypted-secrets
          BLACKSMITH_FORGE_USERNAME: '${{ secrets.username }}'
          BLACKSMITH_FORGE_API_KEY: '${{ secrets.api_key }}'
        run: bundle exec rake module:push
      - name: Create Release Page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} pkg/*.tar.gz --generate-notes
